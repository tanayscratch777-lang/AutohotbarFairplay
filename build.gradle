plugins {
    id "java"
    // MC 26.1+ is unobfuscated, so we use the new non-remapping Loom plugin.
    // (Older tutorials/templates you find online will say "fabric-loom" or
    // "net.fabricmc.fabric-loom-remap" instead -- those are for pre-26.1 MC
    // and will NOT work here. If Gradle can't resolve this plugin id, check
    // https://fabricmc.net/2026/03/14/261.html for the current id/version.)
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/" } // Mod Menu
}

loom {
    // Keep client-only code (GUI, rendering, keybinds) physically separate
    // from common code, matching the current official Fabric example mod
    // layout (src/main + src/client).
    splitEnvironmentSourceSets()

    mods {
        "autohotbar-remake" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // NOTE: no `mappings(...)` line -- MC 26.1+ ships unobfuscated with
    // Mojang's real names already, so there is nothing to remap/deobfuscate.

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu is only needed at compile time (so the config button shows up in Mod Menu
    // if the player has it installed). It is NOT bundled and NOT required to run.
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

java {
    // Minecraft 26.1+ requires Java 25.
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// On MC 26.1+ there is no remapping step, so the plain `jar` task IS the
// final distributable mod jar -- unlike older Fabric projects there is no
// separate `remapJar` task to run. `./gradlew build` produces it under
// build/libs/autohotbar-remake-<version>.jar
jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
